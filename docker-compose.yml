services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.3
    command:
      - start-single-node
      - --insecure
      - --store=/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  cockroach-data:
